[project]
name = "print-assist"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.7", "pydantic==2.14.3", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-cov==7.1.0", "httpx2==2.16.0"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.coverage.run]
branch = true
source = ["print_assist"]

[tool.coverage.report]
show_missing = true
fail_under = 100
